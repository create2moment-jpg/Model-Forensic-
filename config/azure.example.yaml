# Azure ML interface — copy to config/azure.local.yaml (git-ignored) and fill in, or run `mf init`
# (detects the values from your `az login`). Nothing in here is a secret: authentication uses `az login`,
# the default credential chain or a managed identity. Entries that still contain <placeholders> are skipped.
defaults:
  credential: cli          # cli (az login first) | default | managed_identity
  tenant_id: null          # set if your account spans several tenants
  metrics_api: runhistory  # runhistory (pipeline stages + stage outputs) | mlflow
  fast_listing: true       # raw ARM job listing (~1 s/page instead of minutes)
  metric_fidelity: sampled # sampled (as the v1 tool) | full (every logged point; falls back to sampled)
  sync_max_jobs: 1000      # newest jobs indexed per workspace on each sync
  metric_workers: 6        # metric-history requests in parallel when a run's metrics load
  requests_per_s: 8.0      # request budget towards Azure ML (raise carefully: 429 throttling costs more)
  request_burst: 16
  me: []                   # how you appear in runs, e.g. ["Your Name", "you@company.com"] — enables user:me and "Mine" (mf init fills it)

workspaces:
  - name: my-workspace             # short id, becomes the run-id prefix (lowercase, '-' and '_')
    title: "My team · prod"         # label in the workspace dropdown
    subscription_id: <SUBSCRIPTION_ID>
    resource_group: <RESOURCE_GROUP>
    workspace: <WORKSPACE_NAME>
    default: true                   # selected first in the UI
