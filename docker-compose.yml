# Shared Model Forensic behind oauth2-proxy (Entra ID). Fill .env from deploy/.env.example; see docs/deploy.md.
services:
  model-forensic:
    build: .
    volumes:
      - mf-data:/data
      - ./config:/config:ro          # model-forensic.yaml, azure.local.yaml, team.local.yaml (git-ignored)
    environment:
      MF_DATA_DIR: /data
      MF_TEAMS_WEBHOOK: ${MF_TEAMS_WEBHOOK:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}           # managed identity / workload identity for Azure ML (read-only)
    expose: ["8765"]                                   # reachable only through the proxy
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    command:
      - --provider=entra-id
      - --oidc-issuer-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
      - --client-id=${ENTRA_CLIENT_ID}
      - --client-secret=${ENTRA_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --email-domain=*
      - --upstream=http://model-forensic:8765
      - --http-address=0.0.0.0:4180
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --reverse-proxy=true
    ports: ["4180:4180"]                               # put TLS in front (ingress / App Gateway)
    depends_on: [model-forensic]
    restart: unless-stopped

volumes:
  mf-data: {}
