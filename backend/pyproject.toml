[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "model-forensic"
version = "0.1.0"
description = "Forensic workbench for ML experiments: discover, compare, analyze and explain training runs."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
]

[project.optional-dependencies]
azure = ["azure-ai-ml>=1.20", "azure-identity>=1.16", "azure-storage-blob>=12.19", "pyarrow>=14"]
eval = ["pyarrow>=14"]
azure-mlflow = ["model-forensic[azure]", "mlflow-skinny>=2.12", "azureml-mlflow>=1.56"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pyarrow>=14"]

[project.scripts]
mf = "model_forensic.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_forensic"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = ["S101", "RUF012", "S608", "RUF001", "RUF002", "RUF003", "B008", "N818", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Synthetic demo-data generator: numpy-heavy scripting, excluded from strict typing on purpose.
module = "model_forensic.infrastructure.demo.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mlflow", "azure.*"]
ignore_missing_imports = true
