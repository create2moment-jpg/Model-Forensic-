name: release
# Tag vX.Y.Z (or vX.Y.ZrcN) to build: backend wheel + sdist, web bundle, SBOMs, container image (pushed to GHCR).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version matches the tag
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('backend/src/model_forensic/__init__.py').read())[1])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Test
        run: |
          pip install -e "backend[dev]"
          cd backend && ruff check src tests && mypy src && pytest -q
      - name: Calibration gate
        run: mf calibrate --min-score 0.9 --out calibration.md
      - name: Build backend
        run: pip install build && python -m build backend --outdir dist
      - name: Build web
        working-directory: web
        run: npm ci && npm run build && tar czf ../dist/model-forensic-web-${GITHUB_REF_NAME}.tar.gz -C dist .
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements backend/requirements.lock -o dist/sbom-backend.cdx.json
          cd web && npx --yes @cyclonedx/cyclonedx-npm@1.19.3 --output-file ../dist/sbom-web.cdx.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/model-forensic:${{ github.ref_name }}
          sbom: true
          provenance: true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          body_path: CHANGELOG.md
