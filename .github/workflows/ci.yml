name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "backend[dev]"
      - name: Load test (small)
        run: python scripts/loadtest.py --runs 300 --series 5 --points 20000
      - working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e -- --trace off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
  instrument:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrument
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . numpy pytest ruff mmengine
      - run: ruff check src tests examples
      - run: pytest
